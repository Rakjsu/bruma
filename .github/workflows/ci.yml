name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            escopo: "--workspace"
          # O Tauri em Linux precisa de libwebkit2gtk-4.1-dev, libgtk-3-dev e companhia, que o
          # runner nao traz instaladas. O alvo de hoje e Windows, portanto exclui-se a casca
          # Tauri em vez de instalar meia distribuicao so para a compilar. O Linux continua a
          # correr para apanhar cedo codigo que so compile em Windows.
          - os: ubuntu-latest
            escopo: "--workspace --exclude spike2-screen"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatacao
        run: cargo fmt --all -- --check
      - name: Clippy (avisos sao erros)
        run: cargo clippy ${{ matrix.escopo }} --all-targets -- -D warnings
      - name: Testes
        run: cargo test ${{ matrix.escopo }}
      - name: Nenhum segredo commitado
        shell: bash
        run: |
          if git ls-files | grep -E '\.(key|pem|onion)$|^.*identity\.json$|recovery\.txt$'; then
            echo "::error::Ficheiro de segredo commitado -- ver .gitignore"
            exit 1
          fi
