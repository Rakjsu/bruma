name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            escopo: "--workspace"
          # As duas apps Tauri (bruma e spike2-screen) precisam de libwebkit2gtk-4.1-dev,
          # libgtk-3-dev e companhia, que o runner de Linux nao traz. O alvo de hoje e
          # Windows, portanto excluem-se em vez de instalar meia distribuicao. O Linux
          # continua a correr para apanhar cedo codigo que so compile em Windows.
          - os: ubuntu-latest
            escopo: "--workspace --exclude spike2-screen --exclude bruma --exclude instalador"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0   # a mesma do rust-toolchain.toml
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatacao
        run: cargo fmt --all -- --check
      - name: Clippy (avisos sao erros)
        run: cargo clippy ${{ matrix.escopo }} --all-targets -- -D warnings
      - name: Testes
        run: cargo test ${{ matrix.escopo }}
      - name: Nenhum segredo commitado
        shell: bash
        run: |
          # `identity.json` nunca existiu neste projeto: o ficheiro chama-se `indice.json`,
          # e o guarda procurava um nome inventado. Agora procura o que ha mesmo.
          if git ls-files | grep -E '\.(key|pem|onion)$|(^|/)indice\.json$|recovery\.txt$'; then
            echo "::error::Ficheiro de segredo commitado -- ver .gitignore"
            exit 1
          fi
