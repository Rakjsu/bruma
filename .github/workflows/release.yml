name: Release

# Uma release nasce de uma etiqueta. Nada de builds automaticos a cada push:
# uma release e uma decisao, nao um efeito secundario.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilar, assinar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A chave privada vive so aqui e em ~/.tauri na maquina do dono.
          # Sem ela o instalador sai sem assinatura e o auto-update recusa-o.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Bruma ${{ github.ref_name }}"
          releaseBody: |
            **Descarrega o `Instalar-Bruma.exe`** — e o instalador do Bruma, com a cara
            do Bruma. Instala em Arquivos de Programas e pede administrador uma vez.

            > O Windows vai avisar que o editor e desconhecido — o instalador nao tem
            > assinatura de codigo comercial. *Mais informacoes* → *Executar mesmo assim*.
            > A assinatura que existe e a do auto-update, que garante que uma atualizacao
            > veio mesmo daqui e nao de outro sitio.

            O `Bruma_x.y.z_x64-setup.exe` e o veiculo do auto-update; nao precisas dele.
          releaseDraft: false
          # NAO pode ser prerelease. O endpoint do updater aponta para
          # /releases/latest/download/latest.json, e o "latest" do GitHub IGNORA
          # pre-releases -- o updater receberia 404 para sempre, em silencio.
          # A natureza inicial da versao diz-se no numero (0.x) e nas notas, nao aqui.
          prerelease: false
          includeUpdaterJson: true

      # O instalador proprio, construido DEPOIS da app: o build.rs dele embute o
      # bruma.exe de release que o passo acima acabou de compilar. Se trocarem a ordem,
      # ou o payload sai vazio (e o instalador recusa-se a instalar), ou sai velho.
      - name: Instalador proprio
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build -p instalador --release
          Copy-Item target/release/instalador.exe Instalar-Bruma.exe
          gh release upload ${{ github.ref_name }} Instalar-Bruma.exe --clobber
