name: Release

# Uma release nasce de uma etiqueta. Nada de builds automaticos a cada push:
# uma release e uma decisao, nao um efeito secundario.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Duas corridas sobre a MESMA etiqueta mutavam a mesma release com `--clobber` ao mesmo
# tempo: re-etiquetar, ou lancar um `workflow_dispatch` enquanto a corrida do push ainda
# compila, poe duas a enviar Instalar-Bruma.exe para o mesmo sitio. Quem ganhasse a corrida
# decidia o que ficava, e a assinatura podia acabar a ser de OUTRO binario -- o portao novo
# apanharia isso, mas depois de meia hora de compilacao.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    # Um portao pendurado tem de custar minutos, nao as 6 horas do tecto por omissao: a
    # primeira corrida da v0.18.3 ficou 5h39m presa num Wait antes de o runner a matar.
    # Com a cache quente isto demora ~20 min; 90 e folga a seria, nao tolerancia.
    timeout-minutes: 90
    steps:
      # FIXADAS POR SHA (#176): estes passos correm com a chave de assinatura no
      # ambiente, e `@v0`/`@v2` sao alvos moveis -- uma versao nova publicada entre duas
      # releases nossas corria com a unica raiz de confianca que este projecto tem, e e uma
      # raiz sem revogacao. O numero legivel fica no comentario; subir de versao passa a
      # ser uma decisao com commit, nao um acaso.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0" # a mesma do rust-toolchain.toml; explicita porque o SHA ja nao a diz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # A PROVA DO PAR DE CHAVES, ANTES DA MEIA HORA DE COMPILACAO (#175).
      #
      # O verificar-assinatura e o portao certo, mas corria DEPOIS do tauri-action e do
      # instalador: se a chave do segredo e a pubkey do tauri.conf.json nao forem par --
      # rotacao de uma sem a outra, segredo colado com um \n a mais, password errada --
      # gastavam-se trinta minutos para descobrir. Assina-se um rascunho com o MESMO comando
      # do passo real e verifica-se ja: uma recusa custa segundos e diz o que corrigir.
      # O rascunho e o .sig apagam-se; nada disto sobe para lado nenhum.
      - name: A chave privada e a publica sao mesmo par?
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "rascunho para provar o par de chaves" > rascunho.bin
          npx --yes "@tauri-apps/cli@2.11.4" signer sign rascunho.bin
          cargo run -q -p verificar-assinatura -- rascunho.bin rascunho.bin.sig apps/desktop/tauri.conf.json
          rm -f rascunho.bin rascunho.bin.sig
          echo "a chave do segredo e a pubkey da app sao par"

      # A ETIQUETA TEM DE BATER CERTO COM A VERSAO DA APP.
      #
      # O latest.json e escrito a partir da etiqueta; a versao que a app diz de si vem do
      # tauri.conf.json. Se divergirem, o updater anuncia uma versao, instala, a app arranca
      # a dizer outra, e o updater volta a ver a nova disponivel: CICLO DE ATUALIZACAO
      # INFINITO em todas as maquinas instaladas -- e nada, ate agora, o apanhava.
      # E O TERCEIRO SITIO ONDE A VERSAO VIVE, QUE NINGUEM CONFERIA (#174).
      #
      # Isto comparava a etiqueta com o tauri.conf.json e mais nada. Mas quem decide se ha
      # actualizacao e o tauri-plugin-updater, e ele compara o latest.json (escrito a partir
      # da etiqueta) com o PackageInfo da app -- que vem de env!("CARGO_PKG_VERSION"), ou
      # seja, do apps/desktop/Cargo.toml. Os tres numeros sao escritos a mao em tres sitios.
      #
      # Se o Cargo.toml divergir, o portao antigo passava e o estrago era o mesmo que ele
      # existe para impedir: o updater anuncia uma versao, instala, a app arranca a dizer
      # outra, e ele volta a ver a nova disponivel. Ciclo de actualizacao infinito.
      - name: A versao bate certo em todo o lado?
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $conf = (Get-Content apps/desktop/tauri.conf.json -Raw | ConvertFrom-Json).version

          # Ancorado ao inicio da linha e exigindo EXACTAMENTE uma: o Cargo.toml tem outras
          # linhas com `version` (as das dependencias), e apanhar a errada era pior do que
          # nao conferir nada.
          $linhas = @(Get-Content apps/desktop/Cargo.toml | Where-Object { $_ -match '^version = "' })
          if ($linhas.Count -ne 1) {
            Write-Error "encontrei $($linhas.Count) linhas 'version = ' no apps/desktop/Cargo.toml e esperava exactamente uma"
            exit 1
          }
          $cargo = ($linhas[0] -replace '^version = "', '') -replace '"$', ''

          # E o QUARTO sitio (#181): o tauri.conf.json do INSTALADOR, que e o que o
          # tauri-build carimba no recurso de versao do Instalar-Bruma.exe -- o numero que
          # as Propriedades do ficheiro mostram a quem descarrega. O build.rs sincroniza-o
          # sozinho; isto garante que a sincronizacao foi COMMITADA.
          $inst = (Get-Content apps/instalador/tauri.conf.json -Raw | ConvertFrom-Json).version

          if ($tag -ne $conf -or $tag -ne $cargo -or $tag -ne $inst) {
            Write-Error "a etiqueta diz $tag, o tauri.conf.json diz $conf, o Cargo.toml diz $cargo e o instalador diz $inst; os quatro tem de ser iguais antes de publicar"
            exit 1
          }
          "etiqueta, tauri.conf.json, Cargo.toml e instalador dizem todos: $tag"

      # OS TESTES CORREM ANTES DE PUBLICAR.
      #
      # Ate aqui o release nao consultava o CI: uma etiqueta num commit que falhasse os
      # testes ou o clippy publicava a mesma, porque so o `cargo build` era exercitado.
      # A RELEASE E CRIADA AQUI, ANTES DE SE COMPILAR NADA.
      #
      # Na v0.10.4 o token das Actions recusou criar a release -- "Resource not accessible
      # by integration" -- DEPOIS de trinta minutos de compilacao. E o mais estranho: o
      # token tinha `Contents: write` (esta escrito no log do "Set up job") e a v0.10.3
      # tinha passado com o mesmo ficheiro. Criar a release a mao com o `gh` funcionou, e a
      # partir dai o passo do tauri-action enviou para ela sem se queixar.
      #
      # Ou seja: o token consegue ENVIAR para uma release que ja exista, e as vezes nao
      # consegue CRIA-LA. Nao controlo a razao; controlo o custo. Feito aqui, no principio,
      # uma recusa custa dez segundos em vez de meia hora -- e diz o que fazer.
      # A release nasce RASCUNHO e so e publicada no fim, quando tudo passou.
      #
      # A v0.12.3 ensinou porque: um passo tardio falhou, e a release ficou publicada na
      # mesma -- sem o `Instalar-Bruma.exe` e com o `latest.json` do tauri-action a apontar
      # para o pacote NSIS reformado. Quem procurasse actualizacao teria instalado por
      # NSIS, noutra pasta, ao lado da instalacao boa. O workflow ficou vermelho e mais
      # nada: o estrago ja estava na rua.
      #
      # O `releases/latest` do GitHub IGNORA rascunhos. Enquanto for rascunho, as
      # instalacoes existentes continuam a ver a versao anterior, que funciona. Se algum
      # passo falhar, e assim que fica -- e uma falha deixa de custar uma actualizacao
      # errada em todas as maquinas.
      - name: Garantir a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'

          # SE JA EXISTE, TEM DE SER RASCUNHO -- e isto nao estava a ser conferido.
          #
          # Toda a proteccao deste workflow assenta em a release nascer rascunho: o
          # `releases/latest` ignora rascunhos, portanto enquanto os portoes nao passarem
          # ninguem a ve. Mas o `exit 0` daqui so olhava para "existe", e o proprio texto de
          # recuperacao mandava cria-la A MAO com `gh release create` -- que a cria
          # PUBLICADA. Seguindo a receita impressa por este passo, a release ficava visivel a
          # toda a gente antes de um unico portao ter corrido, e o `--clobber` ia enchendo-a
          # de ficheiros a medida que a compilacao avancava.
          $rascunho = (gh release view $tag --json isDraft --jq '.isDraft' 2>$null)
          if ($LASTEXITCODE -eq 0) {
            if ($rascunho -ne 'true') {
              Write-Error @"
          A release $tag ja existe e NAO e rascunho.
          Nao continuo: publicar por cima de uma release ja visivel poe ficheiros meio-feitos
          nas maos de toda a gente, que e exactamente o que este workflow existe para evitar.
          Torna-a rascunho e volta a correr:
              gh release edit $tag --draft
          "@
              exit 1
            }
            "a release $tag ja existe e e rascunho"
            exit 0
          }
          gh release create $tag --title "Bruma $tag" --notes "Bruma $tag" --verify-tag --draft
          if ($LASTEXITCODE -ne 0) {
            Write-Error @"
          Nao consegui criar a release $tag com o token das Actions.
          Cria-a a mao COMO RASCUNHO e volta a correr este workflow:
              gh release create $tag --title "Bruma $tag" --notes "Bruma $tag" --draft
          O `--draft` nao e opcional: sem ele a release fica visivel antes de qualquer portao
          ter corrido, e o auto-update de toda a gente aponta para ficheiros meio-feitos.
          O envio dos ficheiros para uma release que ja existe costuma funcionar.
          "@
            exit 1
          }

      # Os portoes correm sobre o que SAI DAQUI -- a app e o instalador, mais o crate de
      # cripto de que dependem. O `--workspace` arrastava tambem o spike3, que compila o
      # Tor inteiro para nada: vinte minutos de espera em codigo que nao vai na release.
      # O CI, esse, continua a correr sobre tudo a cada push.
      # `shell: bash` com `set -e` NAO e decoracao.
      #
      # Sem `shell`, um passo em Windows corre em PowerShell -- e em PowerShell um comando
      # NATIVO que falha nao para o script. So conta o codigo de saida do ULTIMO comando.
      # Estes tres estavam escritos em linhas seguidas, portanto durante versoes o `cargo
      # clippy` podia falhar e o passo dava-se por bom, porque o `cargo test` a seguir
      # passava. Foi assim que a v0.12.3 saiu com o clippy vermelho: os portoes da release
      # nao gateavam nada.
      - name: Portoes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p bruma -p instalador -p spike-common -p verificar-assinatura -p so-o-que-vai-na-release --all-targets -- -D warnings
          cargo test -p bruma -p spike-common -p instalador -p so-o-que-vai-na-release
          # A lista de andaimes deixa de ser memoria (#120): nenhum nome BRUMA_* pode
          # existir nas fontes sem estar classificado no portao. Foi assim que nove nomes
          # escaparam a primeira lista e um decimo a segunda.
          cargo run -q -p so-o-que-vai-na-release -- --fontes .

      - name: Compilar, assinar e publicar
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A chave privada vive so aqui e em ~/.tauri na maquina do dono.
          # Sem ela o instalador sai sem assinatura e o auto-update recusa-o.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Bruma ${{ github.ref_name }}"
          releaseBody: |
            **Descarrega o `Instalar-Bruma.exe`** — e o unico instalador: o mesmo que
            instala e o mesmo que o auto-update usa. Arquivos de Programas, com pedido
            de administrador.

            > O Windows vai avisar que o editor e desconhecido — o instalador nao tem
            > assinatura de codigo comercial. *Mais informacoes* → *Executar mesmo assim*.
            > A assinatura que existe e a do auto-update, que garante que uma atualizacao
            > veio mesmo daqui e nao de outro sitio.
          # Rascunho ate ao fim -- ver "Garantir a release". Nao e o mesmo que prerelease:
          # um prerelease e publico e o updater ignorava-o para sempre; um rascunho e
          # invisivel e deixa de o ser no ultimo passo.
          releaseDraft: true
          # NAO pode ser prerelease. O endpoint do updater aponta para
          # /releases/latest/download/latest.json, e o "latest" do GitHub IGNORA
          # pre-releases -- o updater receberia 404 para sempre, em silencio.
          # A natureza inicial da versao diz-se no numero (0.x) e nas notas, nao aqui.
          prerelease: false
          includeUpdaterJson: true

      # O instalador proprio, construido DEPOIS da app: o build.rs dele embute o
      # bruma.exe de release que o passo acima acabou de compilar. Se trocarem a ordem,
      # ou o payload sai vazio (e o instalador recusa-se a instalar), ou sai velho.
      #
      # E e tambem o VEICULO DO AUTO-UPDATE: assina-se com a mesma chave minisign,
      # reescreve-se o latest.json para apontar para ele, e os artefactos NSIS saem da
      # release -- o updater das versoes antigas le o latest.json novo e corre o nosso
      # exe com /P /R /UPDATE /ARGS, o dialeto que ele implementa. Um instalador so,
      # para descarregar e para atualizar.
      # Os andaimes de medicao nao vao no que se instala.
      #
      # Foram tirados a mao, e a mao ficaram dois comandos esquecidos que so apanhei a olhar
      # para o exe publicado por outra razao. Da proxima vez que acrescentar uma ferramenta
      # de medicao, o mesmo esquecimento chega sozinho -- por isso e um portao e nao uma boa
      # intencao.
      #
      # Corre DEPOIS do tauri-action, que e quem compila o bruma.exe de release, e ANTES de
      # o instalador o embrulhar: depois de embrulhado o payload vai comprimido e uma busca
      # de texto deixaria de ver seja o que for -- passaria sempre, sem provar nada.
      - name: A release nao leva andaimes de medicao?
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p so-o-que-vai-na-release -- target/release/bruma.exe

      # O PORTAO DOS ANDAIMES PROVA QUE AINDA SABE REPROVAR (#58).
      #
      # Ate aqui as duas ferramentas de portao so eram exercitadas no caso em que PASSAM. E
      # um portao que so foi visto a dizer que sim nao se distingue de um portao avariado --
      # o verificar-assinatura ja foi reescrito uma vez precisamente por isso: a primeira
      # versao passava em todos os testes e estava errada.
      #
      # Sabota-se uma COPIA e exige-se vermelho. Concatenar os bytes no fim chega, porque o
      # que a ferramenta faz e uma busca de texto: se ela disser que uma copia com
      # "BRUMA_ESTRANHO" la dentro esta limpa, deixou de procurar seja o que for.
      - name: O portao dos andaimes ainda sabe reprovar?
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/bruma.exe sabotado.exe
          printf 'BRUMA_ESTRANHO' >> sabotado.exe
          if cargo run -q -p so-o-que-vai-na-release -- sabotado.exe; then
            echo "O PORTAO DISSE QUE ESTA LIMPO UM BINARIO COM 'BRUMA_ESTRANHO' LA DENTRO."
            echo "Ele deixou de procurar: nao publiques nada ate perceber porque."
            rm -f sabotado.exe
            exit 1
          fi
          echo "o portao reprovou a copia sabotada, como devia"
          rm -f sabotado.exe

      - name: Instalador proprio (download e auto-update)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # O INSTALADOR É AGORA UMA APLICAÇÃO DE JANELA (subsistema GUI, para a consola
          # preta não abrir ao duplo clique) — e o PowerShell NÃO ESPERA por aplicações de
          # janela invocadas com `&`, nem lhes lê o código de saída: o $LASTEXITCODE fica
          # com o valor do comando ANTERIOR, e o teste seguinte corre contra um instalador
          # ainda a arrancar. Todos os portões deste passo ficavam ocos — a dizer «saiu com
          # 0» sobre um código que nunca leram. Por isso NUNCA se invoca o instalador com
          # `&` aqui: passa tudo por isto, que espera e devolve o código verdadeiro.
          function Correr {
            param([string]$Exe, [string[]]$Argumentos)
            $saida = [System.IO.Path]::GetTempFileName()
            # WaitForExit() e NAO o -Wait do Start-Process: o -Wait espera pelo processo E
            # POR TODOS OS DESCENDENTES. A corrida com /R relanca o bruma.exe -- que num
            # runner ninguem fecha -- e o -Wait ficou pendurado nele 5h39m ate o tecto das
            # 6 horas matar o job inteiro. O WaitForExit espera SO pelo instalador, que e o
            # unico cujo codigo de saida aqui interessa; o filho relancado e verificado (e
            # morto) pelos passos seguintes.
            $p = Start-Process -FilePath $Exe -ArgumentList $Argumentos -PassThru -NoNewWindow -RedirectStandardOutput $saida
            # Tocar no Handle ANTES da saida, senao o .NET nao guarda o ExitCode e ele vem
            # NULO -- e um "if ($null -ne 0)" e verdadeiro: o portao falhava um instalador
            # que saiu com 0. Visto acontecer na prova local, nao e teoria.
            $null = $p.Handle
            $p.WaitForExit()
            Get-Content $saida -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Remove-Item $saida -ErrorAction SilentlyContinue
            return $p.ExitCode
          }

          cargo build -p instalador --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/release/instalador.exe Instalar-Bruma.exe

          # --- O instalador passa a ser EXECUTADO, e nao so compilado ------------------
          #
          # Ate aqui, o exe que vai para toda a gente nunca era corrido antes de ser
          # publicado. Duas coisas que so se apanham correndo-o:
          #
          #   1. um payload vazio ou truncado -- o build.rs embute um payload vazio se o
          #      bruma.exe nao existir, e uma troca de ordem publicava um instalador que
          #      instala nada;
          #   2. o desinstalador a levar o que nao e dele. Ele apagava `*` da pasta de
          #      instalacao, e a pasta escreve-se a mao num campo de texto.
          #
          # Por isso instala-se numa pasta COM COISAS DENTRO e exige-se que elas sobrevivam.
          $prova = Join-Path $env:RUNNER_TEMP 'prova-instalador'
          Remove-Item -Recurse -Force $prova -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $prova | Out-Null
          'nao me apagues' | Out-File -Encoding utf8 (Join-Path $prova 'tese.docx')
          New-Item -ItemType Directory -Force (Join-Path $prova 'fotos') | Out-Null
          'ferias' | Out-File -Encoding utf8 (Join-Path $prova 'fotos/praia.jpg')

          $c = Correr ./Instalar-Bruma.exe @('--silencioso', '--teste', "--dir=$prova")
          if ($c -ne 0) { Write-Error "o instalador saiu com $c"; exit 1 }

          $app = Join-Path $prova 'bruma.exe'
          if (-not (Test-Path $app)) { Write-Error 'o instalador nao pos la o bruma.exe'; exit 1 }
          $mb = [math]::Round((Get-Item $app).Length / 1MB, 1)
          if ($mb -lt 10) { Write-Error "bruma.exe instalado tem so $mb MB -- payload vazio ou truncado"; exit 1 }
          if (-not (Test-Path (Join-Path $prova 'uninstall.exe'))) { Write-Error 'sem desinstalador'; exit 1 }
          Write-Host "instalou: bruma.exe com $mb MB"

          # O PORTAO PASSA A OLHAR PARA O QUE A PESSOA TEM MESMO (#177).
          #
          # O passo dos andaimes le `target/release/bruma.exe` -- um caminho ASSUMIDO. O
          # rust-cache restaura o `target/`, e se por qualquer razao o tauri-action escrever
          # noutro sitio ou falhar sem parar a corrida, aquele passo inspecciona um binario
          # de outra corrida e diz "release limpa" sobre uma coisa que nao vai na release.
          #
          # Este ficheiro nao e assumido: saiu do payload embutido, foi descomprimido pelo
          # instalador, e e byte a byte aquilo que fica na pasta de quem instalar. E corre
          # AGORA, antes da desinstalacao -- a primeira versao deste passo estava depois
          # dela, a apontar para um ficheiro ja apagado, e so nao rebentou uma release
          # porque foi apanhada antes de haver uma.
          cargo run -q -p so-o-que-vai-na-release -- $app
          if ($LASTEXITCODE -ne 0) { Write-Error 'o bruma.exe REALMENTE instalado leva andaimes'; exit 1 }

          $c = Correr (Join-Path $prova 'uninstall.exe') @('--silencioso', '--teste', "--dir=$prova")
          if ($c -ne 0) { Write-Error "o desinstalador saiu com $c"; exit 1 }
          # A limpeza final e feita por um .cmd solto, e o que ele tem de tirar por ultimo
          # e o PROPRIO uninstall.exe -- o bruma.exe ja foi apagado antes, pelo Rust, de
          # forma sincrona. Esperar pelo bruma.exe era esperar por uma coisa que ja tinha
          # acontecido: o poll saia de imediato e a verificacao seguinte corria antes de o
          # .cmd ter tido tempo de existir. Localmente passava por sorte de escalonamento;
          # no runner falhou a primeira vez.
          $desinst = Join-Path $prova 'uninstall.exe'
          for ($i = 0; $i -lt 60 -and (Test-Path $desinst); $i++) { Start-Sleep -Seconds 1 }
          Write-Host "o desinstalador levou ~$i s a apagar-se"

          if (Test-Path $app) { Write-Error 'o desinstalador deixou o bruma.exe para tras'; exit 1 }
          if (Test-Path (Join-Path $prova 'uninstall.exe')) { Write-Error 'o desinstalador nao se apagou'; exit 1 }
          if (-not (Test-Path (Join-Path $prova 'tese.docx'))) { Write-Error 'o desinstalador APAGOU um ficheiro do utilizador'; exit 1 }
          if (-not (Test-Path (Join-Path $prova 'fotos/praia.jpg'))) { Write-Error 'o desinstalador apagou uma subpasta do utilizador'; exit 1 }
          Write-Host 'desinstalou o que era dele e deixou o resto'

          # O DIALECTO DO UPDATER, CORRIDO A SERIO (#60, #68).
          #
          # O portao instalava com `--silencioso --teste` -- o dialecto NOSSO. Mas todas as
          # actualizacoes existentes chegam por outro: o updater do Tauri corre este exe com
          # /P /R /UPDATE /ARGS. Os testes de unidade provam que o parse esta certo; isto
          # prova que o caminho INTEIRO responde -- instalar por cima, deixar o carimbo
          # fechado, e relancar a app com os argumentos que vem depois do /ARGS.
          #
          # Duas corridas, cada uma a provar uma coisa. Sem /R primeiro, porque o carimbo
          # tem de ser lido ANTES de alguma app arrancar -- a app apaga-o ao arrancar, e uma
          # corrida so teria uma corrida entre o teste e ela.
          Remove-Item "$env:APPDATA\Bruma\actualizacao.json" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $prova 'dados') | Out-Null
          'historico' | Out-File -Encoding utf8 (Join-Path $prova 'dados/sala.json')
          $c = Correr ./Instalar-Bruma.exe @('/P', '/UPDATE', '--teste', "--dir=$prova")
          if ($c -ne 0) { Write-Error "a actualizacao /P /UPDATE saiu com $c"; exit 1 }
          if (-not (Test-Path $app)) { Write-Error 'a actualizacao levou o bruma.exe'; exit 1 }
          if (-not (Test-Path (Join-Path $prova 'dados/sala.json'))) { Write-Error 'a actualizacao APAGOU os dados'; exit 1 }
          $carimbo = Get-Content "$env:APPDATA\Bruma\actualizacao.json" -Raw | ConvertFrom-Json
          if ($carimbo.estado -ne 'pronto') { Write-Error "o carimbo diz '$($carimbo.estado)' e devia dizer 'pronto'"; exit 1 }
          Remove-Item "$env:APPDATA\Bruma\actualizacao.json" -Force -ErrorAction SilentlyContinue
          Write-Host 'actualizou por cima, dados intactos, carimbo fechado'

          # E agora com /R: o processo relancado tem de existir COM os argumentos do /ARGS.
          # A app pode nem conseguir abrir a janela num runner sem cabeca -- nao interessa:
          # o que se afirma e que o processo arrancou com a linha de comandos certa.
          $c = Correr ./Instalar-Bruma.exe @('/P', '/R', '/UPDATE', '--teste', "--dir=$prova", '/ARGS', '--marcador-do-portao')
          if ($c -ne 0) { Write-Error "a actualizacao com /R saiu com $c"; exit 1 }
          $cl = $null
          for ($i = 0; $i -lt 20 -and -not $cl; $i++) {
            Start-Sleep -Seconds 1
            $cl = (Get-CimInstance Win32_Process -Filter "Name='bruma.exe'" |
                   Where-Object { $_.CommandLine -match 'marcador-do-portao' }).CommandLine
          }
          Stop-Process -Name bruma -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\Bruma\actualizacao.json" -Force -ErrorAction SilentlyContinue
          if (-not $cl) { Write-Error 'o /R nao relancou a app com os argumentos do /ARGS'; exit 1 }
          Write-Host "o /R relancou: $cl"

          $c = Correr (Join-Path $prova 'uninstall.exe') @('--silencioso', '--teste', "--dir=$prova")
          if ($c -ne 0) { Write-Error "a segunda desinstalacao saiu com $c"; exit 1 }
          Start-Sleep -Seconds 5

          # A ESCOLHA AUTOMATICA DE PASTA, QUE O --dir SALTAVA SEMPRE (#179).
          #
          # A escolha de onde desinstalar ja correu mal uma vez -- o teste apontou ao
          # Program Files verdadeiro e so as permissoes o travaram. A correccao foi o
          # destino_por_omissao usar a pasta do proprio exe; mas o portao passava sempre
          # --dir, saltando essa funcao por completo. Corre-se de uma COPIA numa pasta
          # descartavel, com uma testemunha na pasta irma: limpa a sua, e mais nenhuma.
          $desc = Join-Path $env:RUNNER_TEMP 'descartavel/dentro'
          $irma = Join-Path $env:RUNNER_TEMP 'descartavel/irma'
          New-Item -ItemType Directory -Force $desc, $irma | Out-Null
          'sobrevivo' | Out-File -Encoding utf8 (Join-Path $irma 'testemunha.txt')
          Copy-Item ./Instalar-Bruma.exe (Join-Path $desc 'uninstall.exe')
          $c = Correr (Join-Path $desc 'uninstall.exe') @('--silencioso', '--teste')
          if ($c -ne 0) { Write-Error "a desinstalacao sem --dir saiu com $c"; exit 1 }
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $desc 'uninstall.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $desc 'uninstall.exe')) { Write-Error 'sem --dir, o desinstalador nao se limpou a si proprio'; exit 1 }
          if (-not (Test-Path (Join-Path $irma 'testemunha.txt'))) { Write-Error 'sem --dir, o desinstalador saiu da sua pasta'; exit 1 }
          Write-Host 'sem --dir: limpou a propria pasta e nao tocou na irma'
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'descartavel') -ErrorAction SilentlyContinue

          Remove-Item -Recurse -Force $prova -ErrorAction SilentlyContinue
          # ----------------------------------------------------------------------------

          # E O INSTALADOR TAMBEM PASSA PELO PORTAO (#57).
          #
          # Ate aqui so o bruma.exe era inspeccionado. O Instalar-Bruma.exe -- o ficheiro que
          # toda a gente descarrega, e o que o auto-update corre -- nunca era visto por nada,
          # apesar de ter la dentro a mesma classe de coisa que a ferramenta existe para
          # apanhar. Corre-se AQUI, com o exe ja construido e antes de ser assinado: assinar
          # um binario que nao passou no portao seria dar-lhe a unica credencial que importa.
          cargo run -q -p so-o-que-vai-na-release -- Instalar-Bruma.exe --instalador
          if ($LASTEXITCODE -ne 0) { Write-Error 'o instalador leva andaimes de medicao'; exit 1 }

          # A assinatura le a chave das MESMAS variaveis de ambiente que o tauri-action.
          # Versao EXACTA (#176): o ^2 descarregava o que quer que fosse o ultimo 2.x no
          # momento, e a chave privada passa por este processo.
          npx --yes "@tauri-apps/cli@2.11.4" signer sign Instalar-Bruma.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $tag = '${{ github.ref_name }}'
          $ver = $tag.TrimStart('v')
          $sig = (Get-Content Instalar-Bruma.exe.sig -Raw).Trim()
          $data = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          # AS NOTAS PASSAM A DIZER O QUE MUDA (#62).
          #
          # O campo notes era "Bruma $ver" -- um numero. E a faixa da app mostrava esse
          # numero a alguem que tem de decidir se vale a pena reiniciar A MEIO DE UMA
          # CHAMADA. A anotacao da etiqueta ja conta o que a versao traz, com o cuidado de
          # sempre; e dai que a faixa passa a falar. O fetch e explicito porque o checkout
          # das Actions nem sempre traz o OBJECTO da etiqueta anotada, so o commit.
          git fetch origin "+refs/tags/${tag}:refs/tags/${tag}" --no-tags --force 2>$null
          # SO de uma etiqueta ANOTADA: numa etiqueta leve o %(contents) devolve a mensagem
          # do COMMIT -- o fallback "-not $notas" nunca disparava, e a faixa da app mostrava
          # um assunto de commit a quem decide se reinicia a meio de uma chamada.
          $tipo = (git cat-file -t $tag 2>$null)
          $notas = if ($tipo -eq 'tag') { (git tag -l $tag --format='%(contents)') } else { '' }
          if ($notas -is [array]) { $notas = $notas -join "`n" }
          if (-not $notas -or -not $notas.Trim()) { $notas = "Bruma $ver" }
          $notas = $notas.Trim()
          if ($notas.Length -gt 3500) { $notas = $notas.Substring(0, 3500) + "`n[...]" }

          $json = @{
            version = $ver
            notes = $notas
            pub_date = $data
            platforms = @{ 'windows-x86_64' = @{
              signature = $sig
              url = "https://github.com/Rakjsu/bruma/releases/download/$tag/Instalar-Bruma.exe"
            } }
          } | ConvertTo-Json -Depth 5
          # UTF-8 SEM BOM, escrito a mao: o -Encoding ascii transformava os acentos das
          # notas em pontos de interrogacao, o utf8 do PowerShell 5.1 poe um BOM, e um BOM
          # a frente de JSON e o updater a recusar o ficheiro inteiro.
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'latest.json'), $json, [System.Text.UTF8Encoding]::new($false))

          gh release upload $tag Instalar-Bruma.exe Instalar-Bruma.exe.sig latest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # O NSIS reformou-se: sai da pagina para ninguem o descarregar por engano.
          # O NSIS reformou-se, mas pode nem la estar -- e nesse caso o `delete-asset`
          # falha. Como e o ULTIMO comando do passo, o codigo de saida dele passava a ser o
          # do passo: uma limpeza opcional a falhar deitava abaixo uma publicacao boa. E ao
          # contrario, se um comando ANTERIOR falhasse, este apagava o rasto disso.
          # Explicito nos dois sentidos: estes podem falhar, e o passo acaba com 0.
          gh release delete-asset $tag "Bruma_${ver}_x64-setup.exe" --yes 2>$null
          gh release delete-asset $tag "Bruma_${ver}_x64-setup.exe.sig" --yes 2>$null
          $global:LASTEXITCODE = 0
          exit 0

      # O portao que faltava, e o que tinha a pior forma de falhar.
      #
      # Os outros portoes olham para nomes de ficheiros e numeros de versao. Nenhum deles
      # podia apanhar a unica coisa de que depende a actualizacao automatica funcionar: que a
      # assinatura publicada se verifica com a chave publica que vai DENTRO da app.
      #
      # Rodar a chave privada sem rodar a `pubkey` do tauri.conf.json (ou ao contrario)
      # publica uma versao com aspecto perfeito -- os ficheiros la estao, o latest.json aponta
      # para o sitio certo -- e deixa toda a gente sem actualizacoes, para sempre, sem um
      # unico erro visivel. Cada versao seguinte agrava, porque ninguem da por nada.
      #
      # Descarregam-se os ficheiros DA RELEASE (ainda rascunho, por isso via `gh`) em vez de
      # se usarem os que estao aqui ao lado: o que interessa provar e o que o updater vai
      # buscar, e nao o que o runner tem em disco.
      - name: A assinatura verifica com a chave que vai na app?
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          rm -rf prova-assinatura && mkdir prova-assinatura
          gh release download "$tag" -p 'Instalar-Bruma.exe' -p 'latest.json' -D prova-assinatura --clobber
          cargo run -q -p verificar-assinatura -- \
            prova-assinatura/Instalar-Bruma.exe \
            prova-assinatura/latest.json \
            apps/desktop/tauri.conf.json

      # E O PORTAO DA ASSINATURA TAMBEM PROVA QUE REPROVA (#58).
      #
      # O passo acima acabou de dizer que a assinatura confere. Isso e metade: falta saber se
      # ele conferia SEJA O QUE FOSSE. Troca-se um byte a MEIO do ficheiro -- e nao no
      # cabecalho PE, que um verificador podia estar a saltar por outra razao -- e exige-se
      # que ele recuse.
      #
      # Se este passo ficar verde, o `verificar-assinatura` nao esta a verificar nada, e a
      # unica coisa que separa uma actualizacao nossa de uma actualizacao de outra pessoa
      # deixou de existir. Vale a pena bloquear a publicacao por isso.
      - name: O portao da assinatura ainda sabe reprovar?
        shell: bash
        run: |
          set -euo pipefail
          cp prova-assinatura/Instalar-Bruma.exe sabotado.exe
          # So com `dd` e `od`, que o Git Bash traz: depender do python aqui era acrescentar
          # uma forma de este passo falhar por uma razao que nada tem a ver com assinaturas.
          #
          # E o byte novo calcula-se a partir do antigo (+1) em vez de ser um valor fixo:
          # escrever 0xFF por cima de um byte que ja fosse 0xFF nao mudava nada, o ficheiro
          # continuava valido, e o passo acusava o verificador de estar avariado quando o
          # avariado era o teste.
          tam=$(stat -c%s sabotado.exe)
          meio=$(( tam / 2 ))
          antigo=$(dd if=sabotado.exe bs=1 skip=$meio count=1 2>/dev/null | od -An -tu1 | tr -d ' ')
          novo=$(( (antigo + 1) % 256 ))
          printf "\x$(printf %02x $novo)" | dd of=sabotado.exe bs=1 seek=$meio count=1 conv=notrunc 2>/dev/null

          # E CONFIRMA-SE QUE A SABOTAGEM PEGOU, antes de tirar conclusoes dela.
          #
          # Da primeira vez que corri isto a mao, o `printf` falhou por um escape mal posto,
          # o `dd` escreveu zero bytes, e o teste disse "recusou" na mesma -- por o ficheiro
          # nem sequer existir. Uma sabotagem que nao pegou faz um portao avariado parecer
          # bom, que e exactamente a falha que este passo existe para apanhar.
          lido=$(dd if=sabotado.exe bs=1 skip=$meio count=1 2>/dev/null | od -An -tu1 | tr -d ' ')
          if [ "$lido" != "$novo" ] || [ "$(stat -c%s sabotado.exe)" != "$tam" ]; then
            echo "A SABOTAGEM NAO PEGOU (queria $novo, esta $lido) -- este passo nao mede nada."
            rm -f sabotado.exe
            exit 1
          fi
          echo "byte no offset $meio de $tam: $antigo -> $novo (confirmado)"
          if cargo run -q -p verificar-assinatura -- \
               sabotado.exe \
               prova-assinatura/latest.json \
               apps/desktop/tauri.conf.json; then
            echo "A ASSINATURA CONFERIU PARA UM FICHEIRO COM UM BYTE TROCADO."
            echo "O verificador nao esta a verificar nada. Nao publiques."
            rm -f sabotado.exe
            exit 1
          fi
          echo "o portao da assinatura recusou a copia sabotada, como devia"
          rm -f sabotado.exe

      # O ULTIMO passo, e so agora: a partir daqui o updater de toda a gente ve isto.
      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'

          # Confirmar o que la esta ANTES de o mostrar. Um `latest.json` a apontar para um
          # ficheiro que nao existe deixa toda a gente sem actualizacoes, em silencio.
          $nomes = (gh release view $tag --json assets --jq '[.assets[].name] | join(" ")')
          foreach ($f in @('Instalar-Bruma.exe', 'Instalar-Bruma.exe.sig', 'latest.json')) {
            if ($nomes -notmatch [regex]::Escape($f)) {
              Write-Error "a release $tag nao tem o $f -- fica rascunho"
              exit 1
            }
          }
          # O `latest.json` que se confere e o MESMO ficheiro que acabou de ser enviado,
          # aqui ao lado. Descarrega-lo outra vez so acrescentava uma forma de falhar.
          $j = Get-Content latest.json -Raw | ConvertFrom-Json
          $url = $j.platforms.'windows-x86_64'.url
          if ($url -notmatch 'Instalar-Bruma\.exe$') {
            Write-Error "o latest.json aponta para $url e nao para o Instalar-Bruma.exe -- fica rascunho"
            exit 1
          }
          if ($j.version -ne $tag.TrimStart('v')) {
            Write-Error "o latest.json diz $($j.version) e a etiqueta e $tag -- fica rascunho"
            exit 1
          }

          # E a pagina da release conta a mesma historia que a etiqueta (#62): quem chega
          # pelo browser le o que muda, nao um texto generico igual em todas as versoes.
          # O paragrafo do download fica em cima, porque e o que quem chega ali procura.
          git fetch origin "+refs/tags/${tag}:refs/tags/${tag}" --no-tags --force 2>$null
          $tipo = (git cat-file -t $tag 2>$null)
          $notas = if ($tipo -eq 'tag') { (git tag -l $tag --format='%(contents)') } else { '' }
          if ($notas -is [array]) { $notas = $notas -join "`n" }
          if ($notas -and $notas.Trim()) {
            $corpo = @"
          **Descarrega o ``Instalar-Bruma.exe``** — e o unico instalador: o mesmo que instala e o mesmo que o auto-update usa.

          > O Windows vai avisar que o editor e desconhecido — *Mais informacoes* → *Executar mesmo assim*.

          ---

          $($notas.Trim())
          "@
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'corpo-da-release.md'), $corpo, [System.Text.UTF8Encoding]::new($false))
            gh release edit $tag --notes-file corpo-da-release.md
            if ($LASTEXITCODE -ne 0) { Write-Error 'nao consegui escrever as notas da release'; exit 1 }
            Remove-Item corpo-da-release.md -ErrorAction SilentlyContinue
          }

          # `--latest` explicito: e este que o endpoint do updater vai buscar, e nao se
          # deixa isso a inferencia de datas.
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "publicada: $tag"
