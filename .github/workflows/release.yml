name: Release

# Uma release nasce de uma etiqueta. Nada de builds automaticos a cada push:
# uma release e uma decisao, nao um efeito secundario.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0   # a mesma do rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2

      # A ETIQUETA TEM DE BATER CERTO COM A VERSAO DA APP.
      #
      # O latest.json e escrito a partir da etiqueta; a versao que a app diz de si vem do
      # tauri.conf.json. Se divergirem, o updater anuncia uma versao, instala, a app arranca
      # a dizer outra, e o updater volta a ver a nova disponivel: CICLO DE ATUALIZACAO
      # INFINITO em todas as maquinas instaladas -- e nada, ate agora, o apanhava.
      - name: A etiqueta bate certo com a versao?
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $app = (Get-Content apps/desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $app) {
            Write-Error "a etiqueta diz $tag e o tauri.conf.json diz $app; corrige um dos dois antes de publicar"
            exit 1
          }
          "etiqueta e versao batem certo: $app"

      # OS TESTES CORREM ANTES DE PUBLICAR.
      #
      # Ate aqui o release nao consultava o CI: uma etiqueta num commit que falhasse os
      # testes ou o clippy publicava a mesma, porque so o `cargo build` era exercitado.
      # A RELEASE E CRIADA AQUI, ANTES DE SE COMPILAR NADA.
      #
      # Na v0.10.4 o token das Actions recusou criar a release -- "Resource not accessible
      # by integration" -- DEPOIS de trinta minutos de compilacao. E o mais estranho: o
      # token tinha `Contents: write` (esta escrito no log do "Set up job") e a v0.10.3
      # tinha passado com o mesmo ficheiro. Criar a release a mao com o `gh` funcionou, e a
      # partir dai o passo do tauri-action enviou para ela sem se queixar.
      #
      # Ou seja: o token consegue ENVIAR para uma release que ja exista, e as vezes nao
      # consegue CRIA-LA. Nao controlo a razao; controlo o custo. Feito aqui, no principio,
      # uma recusa custa dez segundos em vez de meia hora -- e diz o que fazer.
      # A release nasce RASCUNHO e so e publicada no fim, quando tudo passou.
      #
      # A v0.12.3 ensinou porque: um passo tardio falhou, e a release ficou publicada na
      # mesma -- sem o `Instalar-Bruma.exe` e com o `latest.json` do tauri-action a apontar
      # para o pacote NSIS reformado. Quem procurasse actualizacao teria instalado por
      # NSIS, noutra pasta, ao lado da instalacao boa. O workflow ficou vermelho e mais
      # nada: o estrago ja estava na rua.
      #
      # O `releases/latest` do GitHub IGNORA rascunhos. Enquanto for rascunho, as
      # instalacoes existentes continuam a ver a versao anterior, que funciona. Se algum
      # passo falhar, e assim que fica -- e uma falha deixa de custar uma actualizacao
      # errada em todas as maquinas.
      - name: Garantir a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'

          # SE JA EXISTE, TEM DE SER RASCUNHO -- e isto nao estava a ser conferido.
          #
          # Toda a proteccao deste workflow assenta em a release nascer rascunho: o
          # `releases/latest` ignora rascunhos, portanto enquanto os portoes nao passarem
          # ninguem a ve. Mas o `exit 0` daqui so olhava para "existe", e o proprio texto de
          # recuperacao mandava cria-la A MAO com `gh release create` -- que a cria
          # PUBLICADA. Seguindo a receita impressa por este passo, a release ficava visivel a
          # toda a gente antes de um unico portao ter corrido, e o `--clobber` ia enchendo-a
          # de ficheiros a medida que a compilacao avancava.
          $rascunho = (gh release view $tag --json isDraft --jq '.isDraft' 2>$null)
          if ($LASTEXITCODE -eq 0) {
            if ($rascunho -ne 'true') {
              Write-Error @"
          A release $tag ja existe e NAO e rascunho.
          Nao continuo: publicar por cima de uma release ja visivel poe ficheiros meio-feitos
          nas maos de toda a gente, que e exactamente o que este workflow existe para evitar.
          Torna-a rascunho e volta a correr:
              gh release edit $tag --draft
          "@
              exit 1
            }
            "a release $tag ja existe e e rascunho"
            exit 0
          }
          gh release create $tag --title "Bruma $tag" --notes "Bruma $tag" --verify-tag --draft
          if ($LASTEXITCODE -ne 0) {
            Write-Error @"
          Nao consegui criar a release $tag com o token das Actions.
          Cria-a a mao COMO RASCUNHO e volta a correr este workflow:
              gh release create $tag --title "Bruma $tag" --notes "Bruma $tag" --draft
          O `--draft` nao e opcional: sem ele a release fica visivel antes de qualquer portao
          ter corrido, e o auto-update de toda a gente aponta para ficheiros meio-feitos.
          O envio dos ficheiros para uma release que ja existe costuma funcionar.
          "@
            exit 1
          }

      # Os portoes correm sobre o que SAI DAQUI -- a app e o instalador, mais o crate de
      # cripto de que dependem. O `--workspace` arrastava tambem o spike3, que compila o
      # Tor inteiro para nada: vinte minutos de espera em codigo que nao vai na release.
      # O CI, esse, continua a correr sobre tudo a cada push.
      # `shell: bash` com `set -e` NAO e decoracao.
      #
      # Sem `shell`, um passo em Windows corre em PowerShell -- e em PowerShell um comando
      # NATIVO que falha nao para o script. So conta o codigo de saida do ULTIMO comando.
      # Estes tres estavam escritos em linhas seguidas, portanto durante versoes o `cargo
      # clippy` podia falhar e o passo dava-se por bom, porque o `cargo test` a seguir
      # passava. Foi assim que a v0.12.3 saiu com o clippy vermelho: os portoes da release
      # nao gateavam nada.
      - name: Portoes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p bruma -p instalador -p spike-common -p verificar-assinatura --all-targets -- -D warnings
          cargo test -p bruma -p spike-common

      - name: Compilar, assinar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A chave privada vive so aqui e em ~/.tauri na maquina do dono.
          # Sem ela o instalador sai sem assinatura e o auto-update recusa-o.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Bruma ${{ github.ref_name }}"
          releaseBody: |
            **Descarrega o `Instalar-Bruma.exe`** — e o unico instalador: o mesmo que
            instala e o mesmo que o auto-update usa. Arquivos de Programas, com pedido
            de administrador.

            > O Windows vai avisar que o editor e desconhecido — o instalador nao tem
            > assinatura de codigo comercial. *Mais informacoes* → *Executar mesmo assim*.
            > A assinatura que existe e a do auto-update, que garante que uma atualizacao
            > veio mesmo daqui e nao de outro sitio.
          # Rascunho ate ao fim -- ver "Garantir a release". Nao e o mesmo que prerelease:
          # um prerelease e publico e o updater ignorava-o para sempre; um rascunho e
          # invisivel e deixa de o ser no ultimo passo.
          releaseDraft: true
          # NAO pode ser prerelease. O endpoint do updater aponta para
          # /releases/latest/download/latest.json, e o "latest" do GitHub IGNORA
          # pre-releases -- o updater receberia 404 para sempre, em silencio.
          # A natureza inicial da versao diz-se no numero (0.x) e nas notas, nao aqui.
          prerelease: false
          includeUpdaterJson: true

      # O instalador proprio, construido DEPOIS da app: o build.rs dele embute o
      # bruma.exe de release que o passo acima acabou de compilar. Se trocarem a ordem,
      # ou o payload sai vazio (e o instalador recusa-se a instalar), ou sai velho.
      #
      # E e tambem o VEICULO DO AUTO-UPDATE: assina-se com a mesma chave minisign,
      # reescreve-se o latest.json para apontar para ele, e os artefactos NSIS saem da
      # release -- o updater das versoes antigas le o latest.json novo e corre o nosso
      # exe com /P /R /UPDATE /ARGS, o dialeto que ele implementa. Um instalador so,
      # para descarregar e para atualizar.
      - name: Instalador proprio (download e auto-update)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p instalador --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/release/instalador.exe Instalar-Bruma.exe

          # --- O instalador passa a ser EXECUTADO, e nao so compilado ------------------
          #
          # Ate aqui, o exe que vai para toda a gente nunca era corrido antes de ser
          # publicado. Duas coisas que so se apanham correndo-o:
          #
          #   1. um payload vazio ou truncado -- o build.rs embute um payload vazio se o
          #      bruma.exe nao existir, e uma troca de ordem publicava um instalador que
          #      instala nada;
          #   2. o desinstalador a levar o que nao e dele. Ele apagava `*` da pasta de
          #      instalacao, e a pasta escreve-se a mao num campo de texto.
          #
          # Por isso instala-se numa pasta COM COISAS DENTRO e exige-se que elas sobrevivam.
          $prova = Join-Path $env:RUNNER_TEMP 'prova-instalador'
          Remove-Item -Recurse -Force $prova -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $prova | Out-Null
          'nao me apagues' | Out-File -Encoding utf8 (Join-Path $prova 'tese.docx')
          New-Item -ItemType Directory -Force (Join-Path $prova 'fotos') | Out-Null
          'ferias' | Out-File -Encoding utf8 (Join-Path $prova 'fotos/praia.jpg')

          & ./Instalar-Bruma.exe --silencioso --teste "--dir=$prova"
          if ($LASTEXITCODE -ne 0) { Write-Error "o instalador saiu com $LASTEXITCODE"; exit 1 }

          $app = Join-Path $prova 'bruma.exe'
          if (-not (Test-Path $app)) { Write-Error 'o instalador nao pos la o bruma.exe'; exit 1 }
          $mb = [math]::Round((Get-Item $app).Length / 1MB, 1)
          if ($mb -lt 10) { Write-Error "bruma.exe instalado tem so $mb MB -- payload vazio ou truncado"; exit 1 }
          if (-not (Test-Path (Join-Path $prova 'uninstall.exe'))) { Write-Error 'sem desinstalador'; exit 1 }
          Write-Host "instalou: bruma.exe com $mb MB"

          & (Join-Path $prova 'uninstall.exe') --silencioso --teste "--dir=$prova"
          if ($LASTEXITCODE -ne 0) { Write-Error "o desinstalador saiu com $LASTEXITCODE"; exit 1 }
          # A limpeza final e feita por um .cmd solto, e o que ele tem de tirar por ultimo
          # e o PROPRIO uninstall.exe -- o bruma.exe ja foi apagado antes, pelo Rust, de
          # forma sincrona. Esperar pelo bruma.exe era esperar por uma coisa que ja tinha
          # acontecido: o poll saia de imediato e a verificacao seguinte corria antes de o
          # .cmd ter tido tempo de existir. Localmente passava por sorte de escalonamento;
          # no runner falhou a primeira vez.
          $desinst = Join-Path $prova 'uninstall.exe'
          for ($i = 0; $i -lt 60 -and (Test-Path $desinst); $i++) { Start-Sleep -Seconds 1 }
          Write-Host "o desinstalador levou ~$i s a apagar-se"

          if (Test-Path $app) { Write-Error 'o desinstalador deixou o bruma.exe para tras'; exit 1 }
          if (Test-Path (Join-Path $prova 'uninstall.exe')) { Write-Error 'o desinstalador nao se apagou'; exit 1 }
          if (-not (Test-Path (Join-Path $prova 'tese.docx'))) { Write-Error 'o desinstalador APAGOU um ficheiro do utilizador'; exit 1 }
          if (-not (Test-Path (Join-Path $prova 'fotos/praia.jpg'))) { Write-Error 'o desinstalador apagou uma subpasta do utilizador'; exit 1 }
          Write-Host 'desinstalou o que era dele e deixou o resto'
          Remove-Item -Recurse -Force $prova -ErrorAction SilentlyContinue
          # ----------------------------------------------------------------------------

          # A assinatura le a chave das MESMAS variaveis de ambiente que o tauri-action.
          npx --yes "@tauri-apps/cli@^2" signer sign Instalar-Bruma.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $tag = '${{ github.ref_name }}'
          $ver = $tag.TrimStart('v')
          $sig = (Get-Content Instalar-Bruma.exe.sig -Raw).Trim()
          $data = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          @{
            version = $ver
            notes = "Bruma $ver"
            pub_date = $data
            platforms = @{ 'windows-x86_64' = @{
              signature = $sig
              url = "https://github.com/Rakjsu/bruma/releases/download/$tag/Instalar-Bruma.exe"
            } }
          } | ConvertTo-Json -Depth 5 | Out-File latest.json -Encoding ascii

          gh release upload $tag Instalar-Bruma.exe Instalar-Bruma.exe.sig latest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # O NSIS reformou-se: sai da pagina para ninguem o descarregar por engano.
          gh release delete-asset $tag "Bruma_${ver}_x64-setup.exe" --yes
          gh release delete-asset $tag "Bruma_${ver}_x64-setup.exe.sig" --yes

      # O portao que faltava, e o que tinha a pior forma de falhar.
      #
      # Os outros portoes olham para nomes de ficheiros e numeros de versao. Nenhum deles
      # podia apanhar a unica coisa de que depende a actualizacao automatica funcionar: que a
      # assinatura publicada se verifica com a chave publica que vai DENTRO da app.
      #
      # Rodar a chave privada sem rodar a `pubkey` do tauri.conf.json (ou ao contrario)
      # publica uma versao com aspecto perfeito -- os ficheiros la estao, o latest.json aponta
      # para o sitio certo -- e deixa toda a gente sem actualizacoes, para sempre, sem um
      # unico erro visivel. Cada versao seguinte agrava, porque ninguem da por nada.
      #
      # Descarregam-se os ficheiros DA RELEASE (ainda rascunho, por isso via `gh`) em vez de
      # se usarem os que estao aqui ao lado: o que interessa provar e o que o updater vai
      # buscar, e nao o que o runner tem em disco.
      - name: A assinatura verifica com a chave que vai na app?
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          rm -rf prova-assinatura && mkdir prova-assinatura
          gh release download "$tag" -p 'Instalar-Bruma.exe' -p 'latest.json' -D prova-assinatura --clobber
          cargo run -q -p verificar-assinatura -- \
            prova-assinatura/Instalar-Bruma.exe \
            prova-assinatura/latest.json \
            apps/desktop/tauri.conf.json

      # O ULTIMO passo, e so agora: a partir daqui o updater de toda a gente ve isto.
      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'

          # Confirmar o que la esta ANTES de o mostrar. Um `latest.json` a apontar para um
          # ficheiro que nao existe deixa toda a gente sem actualizacoes, em silencio.
          $nomes = (gh release view $tag --json assets --jq '[.assets[].name] | join(" ")')
          foreach ($f in @('Instalar-Bruma.exe', 'Instalar-Bruma.exe.sig', 'latest.json')) {
            if ($nomes -notmatch [regex]::Escape($f)) {
              Write-Error "a release $tag nao tem o $f -- fica rascunho"
              exit 1
            }
          }
          # O `latest.json` que se confere e o MESMO ficheiro que acabou de ser enviado,
          # aqui ao lado. Descarrega-lo outra vez so acrescentava uma forma de falhar.
          $j = Get-Content latest.json -Raw | ConvertFrom-Json
          $url = $j.platforms.'windows-x86_64'.url
          if ($url -notmatch 'Instalar-Bruma\.exe$') {
            Write-Error "o latest.json aponta para $url e nao para o Instalar-Bruma.exe -- fica rascunho"
            exit 1
          }
          if ($j.version -ne $tag.TrimStart('v')) {
            Write-Error "o latest.json diz $($j.version) e a etiqueta e $tag -- fica rascunho"
            exit 1
          }

          # `--latest` explicito: e este que o endpoint do updater vai buscar, e nao se
          # deixa isso a inferencia de datas.
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "publicada: $tag"
