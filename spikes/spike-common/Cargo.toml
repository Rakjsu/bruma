[package]
name = "spike-common"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
anyhow = "1"
data-encoding = "2"
# As palavras de recuperacao. `default-features = false` tira a lista de idiomas que
# nao usamos e a dependencia de rand, que aqui nao faz falta.
bip39 = { version = "2", default-features = false, features = ["std"] }
