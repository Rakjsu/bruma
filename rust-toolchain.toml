# O compilador e o mesmo aqui e no CI, e por isso o portao da a mesma resposta nos dois.
#
# Sem isto, cada lado usa o Rust que tem. O runner instala o `stable` fresco; esta maquina
# tinha um `stable` de ha semanas. O do runner tinha um lint que o daqui nao tinha
# (`chunks_exact_to_as_chunks`) e, durante dias, o `cargo clippy` local dizia que estava
# tudo bem enquanto o CI recusava cada commit -- sem ninguem reparar, porque um sinal que
# esta sempre vermelho deixa de ser lido.
#
# Fixa-se a VERSAO e nao o canal: `stable` resolve para o que ja esta instalado, que e
# precisamente como as duas maquinas se afastaram. A mesma string esta nos dois workflows.
#
# Subir de versao passa a ser um commit deliberado -- e e ai que os lints novos aparecem,
# de uma vez e a vista, em vez de um dia qualquer no CI de outra pessoa.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
