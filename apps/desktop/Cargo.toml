[package]
name = "bruma"
version = "0.9.0"
edition.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spike-common = { path = "../../spikes/spike-common" }
tauri = { version = "2", features = [] }
iroh = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# O `send_datagram` do iroh recebe `Bytes`, e nao um Vec.
bytes = "1"
anyhow = "1"
data-encoding = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Deteção do que está aberto, para a barra de "estás a jogar X".
[target.'cfg(windows)'.dependencies]
windows-capture = "2"
# O macro #[implement] gera codigo que procura `windows_core` na raiz do crate.
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
] }
