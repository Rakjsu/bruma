[package]
name = "instalador"
version = "0.1.0"
edition.workspace = true
publish = false

# O instalador do Bruma, feito de raiz. Ver src/main.rs para o porque de cada decisao.

[build-dependencies]
tauri-build = { version = "2", features = [] }
zstd = "0.13"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zstd = "0.13"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  # Para o AttachConsole: sem consola preta ao duplo clique, mas com saida no CI (#180).
  "Win32_System_Console",
] }
